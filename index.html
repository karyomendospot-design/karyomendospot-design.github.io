    .txid-text { font-family: monospace; font-size: 11px; color: #555; background: #eee; padding: 4px 6px; border-radius: 4px; display: block; margin-top: 6px; word-break: break-all; }

</head>
<body>

<div class="container">

  </div>
  <p class="subtitle">Direktori Jasa Harian & Perbaikan Rumah Terpercaya</p>

    <button class="btn" onclick="loginPi()">Masuk dengan Akun Pi</button>
  </div>

  <div id="user-info" class="status">Menyiapkan sistem Pi SDK...</div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-layanan" onclick="gantiTab('layanan')">Daftar Jasa</button>
    <button class="tab-btn" id="tab-pesanan" onclick="gantiTab('pesanan')">Pesanan Saya (<span id="order-count">0</span>)</button>
  </div>

  <div id="view-layanan">
    <div class="filters">
      <button class="pill active" onclick="filterKategori('Semua', this)">Semua</button>
      <button class="pill" onclick="filterKategori('Elektronik', this)">Elektronik</button>
      <button class="pill" onclick="filterKategori('Bangunan', this)">Bangunan</button>
      <button class="pill" onclick="filterKategori('Kebersihan', this)">Kebersihan</button>
    </div>

    <div id="service-list"></div>
  </div>

  <div id="view-pesanan" style="display: none;">
    <div id="order-list">
      <p style="text-align: center; color: #777; font-size: 13px; padding: 20px 0;">Belum ada riwayat pesanan jasa.</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="booking-modal">

    <h3 id="modal-title">Form Pemesanan Jasa</h3>
    <p id="modal-subtitle" style="font-size: 12.5px; color: #666; margin-top: -8px; margin-bottom: 14px;"></p>
    
    <div class="form-group">
      <label>Nama Lengkap Pemesan</label>
      <input type="text" id="input-nama" placeholder="Contoh: Budi Santoso">

      <input type="tel" id="input-wa" placeholder="Contoh: 081234567890">
    </div>
    <div class="form-group">
      <label>Alamat Lengkap Kunjungan</label>
      <textarea id="input-alamat" rows="2" placeholder="Masukkan nama jalan, nomor rumah, dan patokan..."></textarea>
    </div>
    <div class="form-group">
      <label>Tanggal Kunjungan</label>
      <input type="date" id="input-tanggal">
    </div>

    <button class="btn" onclick="prosesBayarForm()">Lanjut Bayar DP via Pi Wallet</button>
    <button class="btn btn-outline" onclick="tutupModal()">Batal</button>
  </div>
</div>

  function renderJasa(kategori) {
    var container = document.getElementById('service-list');
    container.innerHTML = "";
    for (var i = 0; i < daftarJasa.length; i++) {
      var jasa = daftarJasa[i];
      if (kategori !== 'Semua' && jasa.kategori !== kategori) continue;
      container.innerHTML +=
        '<div class="card">' +
          '<div class="card-top">' +
            '<h3>' + jasa.nama + '</h3>' +
            '<span class="rating">★ ' + jasa.rating + '</span>' +
          '</div>' +
          '<div class="provider">Mitra: ' + jasa.mitra + '</div>' +
          '<p>' + jasa.deskripsi + '</p>' +
          '<div class="price-row">' +
            '<span>Biaya Booking (DP):</span>' +
            '<span class="price-tag">' + jasa.dp + ' Test-Pi</span>' +
          '</div>' +
          '<button class="btn" onclick="bukaModal(' + jasa.id + ')">Pesan Jasa (' + jasa.dp + ' Pi)</button>' +
        '</div>';
    }
  }

  function filterKategori(kategori, btnElement) {
    var pills = document.querySelectorAll('.pill');
    for (var i = 0; i < pills.length; i++) {
      pills[i].classList.remove('active');
    }
    btnElement.classList.add('active');
    renderJasa(kategori);
  }

  function gantiTab(tab) {
    document.getElementById('tab-layanan').classList.toggle('active', tab === 'layanan');
    document.getElementById('tab-pesanan').classList.toggle('active', tab === 'pesanan');
    document.getElementById('view-layanan').style.display = tab === 'layanan' ? 'block' : 'none';
    document.getElementById('view-pesanan').style.display = tab === 'pesanan' ? 'block' : 'none';
    if (tab === 'pesanan') renderRiwayat();
  }
