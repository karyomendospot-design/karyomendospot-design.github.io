<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LokaServe - Jasa Lokal Terpercaya</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 480px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #593B8B; font-size: 22px; margin-bottom: 5px; }
    p.subtitle { color: #666; font-size: 14px; margin-top: 0; }
    .btn { background-color: #593B8B; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold; margin-top: 10px; }
    .btn:active { background-color: #452c6e; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-top: 15px; }
    .card h3 { margin: 0 0 5px 0; font-size: 16px; }
    .card p { margin: 0 0 10px 0; font-size: 13px; color: #555; }
    .status { background: #eef6ff; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 15px; color: #004085; word-break: break-all; }
  </style>
</head>
<body>

<div class="container">
  <h1>LokaServe v4</h1>
  <p class="subtitle">Direktori Jasa Harian & Perbaikan Rumah</p>

  <div id="auth-section">
    <button class="btn" onclick="loginPi()">Masuk dengan Akun Pi</button>
  </div>

  <div id="user-info" class="status">Memuat sistem Pi SDK...</div>

  <div class="card">
    <h3>Servis & Cuci AC Panggilan</h3>
    <p>Pembersihan unit AC dan pengecekan freon area sekitar.</p>
    <button class="btn" onclick="pesanJasa('Servis AC', 0.5)">Booking DP (0.5 Pi)</button>
  </div>

  <div class="card">
    <h3>Jasa Tukang & Perbaikan Ringan</h3>
    <p>Perbaikan pipa bocor, kelistrikan dasar, dan cat dinding.</p>
    <button class="btn" onclick="pesanJasa('Tukang Harian', 1.0)">Booking DP (1.0 Pi)</button>
  </div>
</div>

<script>
  const statusBox = document.getElementById('user-info');
  let currentUser = null;

  const proto = "https:" + "//";
  const sdkDomain = ["sdk", "minepi", "com"].join(".");
  const gasDomain = ["script", "google", "com"].join(".");
  const deploymentId = "AKfycbwRvgS4-QIjB9dB9aYB8HY39Mvgw4uNriW5YiGA_69nHhgrJY3O0xkJYNXdw5SU2ypvdg";
  const BACKEND_URL = proto + gasDomain + "/macros/s/" + deploymentId + "/exec";

  const sdkScript = document.createElement('script');
  sdkScript.src = proto + sdkDomain + "/pi-sdk.js";
  sdkScript.onload = function() {
    if (window.Pi) {
      window.Pi.init({ version: "2.0", sandbox: false });
      statusBox.innerText = "Sistem Pi siap! Silakan tekan tombol Masuk dengan Akun Pi.";
    } else {
      statusBox.innerText = "Objek Pi tidak ditemukan. Pastikan dibuka lewat Pi Browser.";
    }
  };
  sdkScript.onerror = function() {
    statusBox.innerText = "Gagal memuat Pi SDK. Periksa koneksi internet Anda.";
  };
  document.head.appendChild(sdkScript);

  async function hubungiBackend(payloadData) {
    try {
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payloadData)
      });
      const text = await response.text();
      statusBox.innerText = "Respon Server: " + text;
      return JSON.parse(text);
    } catch (err) {
      statusBox.innerText = "Error Koneksi Backend: " + err.message;
      throw err;
    }
  }

  async function loginPi() {
    if (!window.Pi) {
      statusBox.innerText = "Tunggu sebentar, Pi SDK sedang dimuat atau buka melalui Pi Browser.";
      return;
    }

    statusBox.innerText = "Meminta izin akses ke akun Pi Anda...";
    try {
      const scopes = ['username', 'payments'];
      const authResult = await window.Pi.authenticate(scopes, onIncompletePaymentFound);
      currentUser = authResult.user;
      
      document.getElementById('auth-section').style.display = 'none';
      statusBox.innerText = "Halo, @" + currentUser.username + "! Akun terhubung.";
    } catch (err) {
      statusBox.innerText = "Gagal login: " + err.message;
    }
  }

  async function onIncompletePaymentFound(payment) {
    statusBox.innerText = "Menemukan transaksi tertunda (" + payment.identifier + "), memproses...";
    if (payment.transaction && payment.transaction.txid) {
      await hubungiBackend({
        action: "complete",
        paymentId: payment.identifier,
        txid: payment.transaction.txid
      });
    } else {
      await hubungiBackend({
        action: "approve",
        paymentId: payment.identifier
      });
    }
  }

  function pesanJasa(namaJasa, jumlahPi) {
    if (!currentUser) {
      statusBox.innerText = "Silakan tekan 'Masuk dengan Akun Pi' terlebih dahulu.";
      return;
    }

    statusBox.innerText = "Membuka jendela pembayaran Pi Wallet...";
    window.Pi.createPayment({
      amount: jumlahPi,
      memo: "DP Pemesanan: " + namaJasa,
      metadata: { service: namaJasa }
    }, {
      onReadyForServerApproval: async function(paymentId) {
        statusBox.innerText = "Mengirim persetujuan ke server untuk ID: " + paymentId;
        await hubungiBackend({ action: "approve", paymentId: paymentId });
      },
      onReadyForServerCompletion: async function(paymentId, txid) {
        statusBox.innerText = "Menyelesaikan transaksi blockchain...";
        await hubungiBackend({ action: "complete", paymentId: paymentId, txid: txid });
        statusBox.innerText = "Pembayaran DP " + namaJasa + " Berhasil! TXID: " + txid;
      },
      onCancel: function(paymentId) {
        statusBox.innerText = "Pembayaran dibatalkan oleh pengguna.";
      },
      onError: function(error, payment) {
        statusBox.innerText = "Error Pi SDK: " + error.message;
      }
    });
  }
</script>

</body>
</html>
